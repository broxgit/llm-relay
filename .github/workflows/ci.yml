name: CI

on:
  # The two paths-ignore lists must stay the same. cowork/ is left out on purpose: the tests read its SKILL.md.
  push:
    branches: [main]
    paths-ignore:
      - "design-and-decisions/**"
      - "docs/**"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "design-and-decisions/**"
      - "docs/**"
      - "README.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning relay.sh cowork/remote-pair-run/runlib.sh tests/smoke.sh tests/play-cowork.sh tests/ask-haiku.sh scripts/release.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS runners put a newer bash first on the PATH. Most Macs run Apple's
      # bash 3.2, so test with that one.
      - name: Use Apple's bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - name: Smoke tests
        run: |
          bash --version | head -n 1
          tests/smoke.sh
